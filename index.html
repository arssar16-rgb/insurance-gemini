<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة متابعة طلبات التأمين - مدينة الملك سلمان الطبية</title>
  
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Cairo', sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3.5 flex flex-col sm:flex-row items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-blue-600 text-white flex items-center justify-center text-lg shadow-sm">
          <i class="fa-solid fa-notes-medical"></i>
        </div>
        <div>
          <h1 class="text-base sm:text-lg font-bold text-slate-900 leading-tight">سجل متابعة طلبات التأمين</h1>
          <p class="text-xs text-slate-500">مدينة الملك سلمان الطبية (KSAMC) • مزامنة تلقائية مع قوقل شيت</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <span id="syncBadge" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          مباشر ومحدث
        </span>
        <button onclick="fetchSheetData()" class="flex items-center gap-2 px-3.5 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold transition shadow-sm">
          <i id="syncIcon" class="fa-solid fa-arrows-rotate"></i>
          <span>تحديث البيانات</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 space-y-5 flex-1 w-full">

    <!-- KPI Cards -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold text-slate-400">إجمالي الطلبات</p>
          <h3 id="statTotal" class="text-2xl font-bold text-slate-800 mt-0.5">0</h3>
        </div>
        <div class="w-10 h-10 rounded-xl bg-slate-100 text-slate-600 flex items-center justify-center text-base">
          <i class="fa-solid fa-list-check"></i>
        </div>
      </div>

      <div class="bg-white p-4 rounded-2xl border border-amber-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold text-amber-600">تحت الإجراء</p>
          <h3 id="statPending" class="text-2xl font-bold text-amber-600 mt-0.5">0</h3>
        </div>
        <div class="w-10 h-10 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center text-base">
          <i class="fa-solid fa-clock-rotate-left"></i>
        </div>
      </div>

      <div class="bg-white p-4 rounded-2xl border border-emerald-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold text-emerald-600">تم الإنجاز</p>
          <h3 id="statCompleted" class="text-2xl font-bold text-emerald-600 mt-0.5">0</h3>
        </div>
        <div class="w-10 h-10 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-base">
          <i class="fa-solid fa-circle-check"></i>
        </div>
      </div>
    </div>

    <!-- Filters & Search Bar -->
    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row items-stretch md:items-center justify-between gap-3">
      <div class="relative flex-1 max-w-md">
        <i class="fa-solid fa-magnifying-glass absolute right-3.5 top-3 text-slate-400 text-sm"></i>
        <input 
          id="searchInput" 
          type="text" 
          placeholder="بحث سريع (الاسم، رقم الملف، الجوال، المطلوب...)" 
          class="w-full pl-4 pr-10 py-
