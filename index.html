<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KSAMC | نظام متابعة التأمين الطبي</title>
  <style>
    :root {
      --green: #00635e;
      --green-hover: #0d8985;
      --dark: #003d42;
      --bg: #eef3f8;
      --panel: #ffffff;
      --line: #dce5ee;
      --text: #172b3d;
      --muted: #697d8b;
      --th-bg: #eff5f8;
      --input-bg: #ffffff;
      --input-border: #cbd8e4;
      --sec-bg: #eaf0f5;
      --sec-text: #263e4d;
      --sec-border: #d0dce6;
      --row-hover: #f8fbfe;
      --stat-blue-bg: #e2efff;
      --stat-blue-text: #172b3d;
      --stat-orange-bg: #fff0df;
      --stat-orange-text: #172b3d;
      --stat-purple-bg: #eee8ff;
      --stat-purple-text: #172b3d;
      --stat-green-bg: #dcf5e7;
      --stat-green-text: #172b3d;
    }

    body.dark {
      --green: #008f87;
      --green-hover: #00a89f;
      --dark: #002529;
      --bg: #0b131e;
      --panel: #152232;
      --line: #26384d;
      --text: #e6eef6;
      --muted: #94a8be;
      --th-bg: #1c2d42;
      --input-bg: #0f1926;
      --input-border: #2e435c;
      --sec-bg: #1e3045;
      --sec-text: #d6e4f0;
      --sec-border: #314862;
      --row-hover: #1a2a3d;
      --stat-blue-bg: #132a4a;
      --stat-blue-text: #90c2ff;
      --stat-orange-bg: #3b2610;
      --stat-orange-text: #ffc278;
      --stat-purple-bg: #271b45;
      --stat-purple-text: #cbb6ff;
      --stat-green-bg: #0f3526;
      --stat-green-text: #7ee2b8;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      transition: background 0.2s, color 0.2s;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; transition: 0.15s; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .app {
      display: flex;
      min-height: 100vh;
      width: 100%;
    }
    .sidebar {
      width: 240px;
      flex-shrink: 0;
      background: linear-gradient(160deg, #00645f, #003b40);
      color: white;
      padding: 20px 14px;
      display: flex;
      flex-direction: column;
    }
    body.dark .sidebar {
      background: linear-gradient(160deg, #0d212e, #08151e);
      border-left: 1px solid var(--line);
    }
    .brand {
      font-size: 18px;
      font-weight: bold;
      line-height: 1.8;
      padding: 12px;
      border-bottom: 1px solid #ffffff2e;
      margin-bottom: 16px;
    }
    .brand small {
      display: block;
      font-size: 11px;
      font-weight: normal;
      opacity: 0.85;
    }
    .nav {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      text-align: right;
      background: transparent;
      color: white;
      border: 0;
      padding: 13px 14px;
      border-radius: 10px;
      margin: 4px 0;
      font-weight: bold;
    }
    .nav.active, .nav:hover {
      background: var(--green-hover);
    }

    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }
    .header {
      background: linear-gradient(110deg, #006d68, #003f45);
      color: white;
      padding: 20px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    body.dark .header {
      background: linear-gradient(110deg, #102a38, #0a1b26);
      border-bottom: 1px solid var(--line);
    }
    .header h1 { font-size: 20px; margin: 0; }
    .header p { margin: 6px 0 0; font-size: 12px; opacity: 0.9; }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .theme-btn, .sync-btn {
      background: rgba(255, 255, 255, 0.15);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 10px;
      padding: 9px 14px;
      font-weight: bold;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .theme-btn:hover, .sync-btn:hover { background: rgba(255, 255, 255, 0.25); }

    .content {
      padding: 20px;
      max-width: 1450px;
      width: 100%;
      margin: 0 auto;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 18px;
    }
    .stat {
      border-radius: 13px;
      padding: 18px;
      border: 1px solid var(--line);
      font-weight: bold;
    }
    .stat strong {
      font-size: 30px;
      display: block;
      margin-top: 8px;
    }
    .blue { background: var(--stat-blue-bg); color: var(--stat-blue-text); }
    .orange { background: var(--stat-orange-bg); color: var(--stat-orange-text); }
    .purple { background: var(--stat-purple-bg); color: var(--stat-purple-text); }
    .green { background: var(--stat-green-bg); color: var(--stat-green-text); }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.05);
    }
    .panel h2 {
      margin: 0 0 16px;
      font-size: 17px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    .btn {
      border: 0;
      border-radius: 9px;
      background: var(--green);
      color: white;
      padding: 10px 15px;
      font-weight: bold;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn:hover { opacity: 0.92; }
    .btn.secondary {
      background: var(--sec-bg);
      color: var(--sec-text);
      border: 1px solid var(--sec-border);
    }
    .btn.danger { background: #bf3535; color: white; }
    .btn.gold { background: #ffedbd; color: #694800; }
    body.dark .btn.gold { background: #4a380b; color: #ffd670; }
    .btn.small { padding: 6px 10px; font-size: 12px; border-radius: 7px; }

    input, select, textarea {
      border: 1px solid var(--input-border);
      border-radius: 9px;
      padding: 10px 12px;
      background: var(--input-bg);
      color: var(--text);
      width: 100%;
    }
    textarea { min-height: 85px; resize: vertical; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-weight: bold; font-size: 12px; }
    .formgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .full { grid-column: 1 / -1; }

    .tablewrap {
      width: 100%;
      overflow-x: auto;
      border-radius: 10px;
      border: 1px solid var(--line);
    }
    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 920px;
    }
    th, td {
      padding: 12px 10px;
      text-align: right;
      border-bottom: 1px solid var(--line);
      vertical-align: middle;
    }
    tbody tr:hover { background: var(--row-hover); }
    th {
      background: var(--th-bg);
      font-size: 12px;
      white-space: nowrap;
    }

    .pill {
      display: inline-block;
      border-radius: 20px;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: bold;
      background: #dceaff;
      color: #174ca0;
      white-space: nowrap;
    }
    .pill.done { background: #d9f6e5; color: #087041; }
    .pill.late { background: #ffe0e0; color: #b02020; }
    .pill.wait { background: #fff0ce; color: #946000; }
    body.dark .pill { background: #1a365d; color: #90cdf4; }
    body.dark .pill.done { background: #123e2c; color: #68d391; }
    body.dark .pill.late { background: #4a1c1c; color: #feb2b2; }
    body.dark .pill.wait { background: #463210; color: #fbd38d; }

    .muted { font-size: 12px; color: var(--muted); }
    .cards { display: none; }
    .casecard {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 12px;
      background: var(--panel);
    }
    .casecard h3 { margin: 0 0 8px; font-size: 16px; }
    .casecard p { margin: 6px 0; font-size: 13px; }
    .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .empty { text-align: center; padding: 45px 10px; color: var(--muted); font-size: 15px; }

    .modalback {
      position: fixed;
      inset: 0;
      background: rgba(0, 20, 30, 0.72);
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }
    .modal {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 15px;
      padding: 20px;
      width: 100%;
      max-width: 780px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modalhead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
    }
    .modalhead h2 { margin: 0; font-size: 18px; }

    .chip-bar {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 6px;
    }
    .chip {
      background: var(--sec-bg);
      color: var(--sec-text);
      border: 1px solid var(--sec-border);
      border-radius: 16px;
      padding: 5px 10px;
      font-size: 11px;
    }

    .fab, .mobilebar { display: none; }
    .chartbar {
      height: 12px;
      background: var(--sec-bg);
      border-radius: 10px;
      overflow: hidden;
      margin: 8px 0 16px;
    }
    .chartbar span {
      display: block;
      height: 100%;
      background: var(--green);
    }

    @media (max-width: 980px) {
      .sidebar { width: 190px; }
      .stats { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 740px) {
      .sidebar { display: none; }
      .header { padding: 15px; }
      .header h1 { font-size: 16px; }
      .content { padding: 12px 12px 95px; }
      .stat { padding: 14px; }
      .stat strong { font-size: 24px; }
      .panel { padding: 14px; }
      .formgrid { grid-template-columns: 1fr; }
      .full { grid-column: auto; }
      .tablewrap { display: none; }
      .cards { display: block; }
      .mobilebar {
        display: flex;
        position: fixed;
        bottom: 0;
        right: 0;
        left: 0;
        z-index: 30;
        background: var(--panel);
        border-top: 1px solid var(--line);
        justify-content: space-around;
        padding: 8px 4px max(10px, env(safe-area-inset-bottom));
      }
      .mobilebar button {
        background: none;
        border: 0;
        color: var(--muted);
        font-size: 11px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        align-items: center;
      }
      .mobilebar button.active { color: var(--green); font-weight: bold; }
      .mobilebar b { font-size: 20px; }
      .fab {
        display: flex;
        align-items: center;
        justify-content: center;
        position: fixed;
        left: 18px;
        bottom: 82px;
        border-radius: 50%;
        width: 54px;
        height: 54px;
        font-size: 26px;
        z-index: 29;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      }
    }
  </style>
</head>
<body>
<div id="root"></div>

<script>
"use strict";

const $ = s => document.querySelector(s);
const escapeHTML = v => String(v ?? "").replace(/[&<>"']/g, c => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
}[c]));
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now() + "-" + Math.random().toString(16).slice(2);
const todayStr = () => {
  const d = new Date();
  return d.getFullYear() + "/" + String(d.getMonth() + 1).padStart(2, "0") + "/" + String(d.getDate()).padStart(2, "0");
};

const STORE_KEY = "KSAMC_INSURANCE_V5";
const THEME_KEY = "KSAMC_THEME_DARK";

// رابط Google Apps Script الخاص بك المربوط بالشيت مباشرة
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzFELNfr-XmJsq1E1xjl2rLSFbdtkY4Dm6qy4bPRXbzk6LlUbWovbEUOj4ShnjLvefN/exec";

let state = {
  cases: [],
  settings: { lateDays: 2 }
};

let page = "home";
let search = "";
let typeFilter = "";
let statusFilter = "";
let isDark = false;
let isSyncing = false;

function initTheme() {
  isDark = localStorage.getItem(THEME_KEY) === "1";
  document.body.classList.toggle("dark", isDark);
}

window.toggleTheme = function() {
  isDark = !isDark;
  localStorage.setItem(THEME_KEY, isDark ? "1" : "0");
  document.body.classList.toggle("dark", isDark);
  render();
};

async function fetchFromSheet() {
  if (!SCRIPT_URL) return;
  isSyncing = true;
  updateSyncButton();
  try {
    const res = await fetch(SCRIPT_URL);
    const data = await res.json();
    if (data.ok && Array.isArray(data.cases) && data.cases.length > 0) {
      state.cases = data.cases;
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
    }
  } catch (err) {
    console.error("Sync error:", err);
  }
  isSyncing = false;
  updateSyncButton();
  render();
}

async function syncToSheet() {
  if (!SCRIPT_URL) return;
  isSyncing = true;
  updateSyncButton();
  try {
    await fetch(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify({ cases: state.cases })
    });
  } catch (err) {
    console.error("Post error:", err);
  }
  isSyncing = false;
  updateSyncButton();
}

function updateSyncButton() {
  const btn = $("#syncBtn");
  if (btn) {
    btn.innerHTML = isSyncing ? "⏳ جاري المزامنة..." : "🔄 مزامنة الشيت";
  }
}

function loadLocal() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed.cases)) state = parsed;
    }
  } catch (e) {
    console.error(e);
  }
}

function saveAndSync() {
  localStorage.setItem(STORE_KEY, JSON.stringify(state));
  syncToSheet();
  render();
}

function daysSince(dateStr) {
  if (!dateStr) return 0;
  const normalized = String(dateStr).replace(/\//g, "-");
  const d = new Date(normalized);
  return isNaN(d.getTime()) ? 0 : (Date.now() - d.getTime()) / 86400000;
}

function isLate(c) {
  return c.status !== "تم الإنجاز" && daysSince(c.receivedDate) >= Number(state.settings.lateDays || 2);
}

function statusLabel(c) {
  return isLate(c) ? "متأخرة" : (c.status || "تحت الإجراء");
}

function pill(c) {
  const cls = c.status === "تم الإنجاز" ? "done" : isLate(c) ? "late" : "wait";
  return `<span class="pill ${cls}">${escapeHTML(statusLabel(c))}</span>`;
}

function stats() {
  const all = state.cases;
  const active = all.filter(c => c.status !== "تم الإنجاز");
  const done = all.filter(c => c.status === "تم الإنجاز");
  const late = active.filter(isLate);
  return { total: all.length, active: active.length, done: done.length, late: late.length };
}

function filteredCases(archive = false) {
  return state.cases.filter(c => {
    if (archive && c.status !== "تم الإنجاز") return false;
    if (!archive && c.status === "تم الإنجاز") return false;
    const hay = [c.name, c.mrn, c.phone, c.nationalId, c.document, c.type, c.department].join(" ").toLowerCase();
    const matchSearch = !search || hay.includes(search.toLowerCase());
    const matchType = !typeFilter || c.type === typeFilter;
    const matchStatus = !statusFilter || (statusFilter === "متأخرة" ? isLate(c) : c.status === statusFilter);
    return matchSearch && matchType && matchStatus;
  });
}

function formatSaudiPhone(phone) {
  let clean = String(phone || "").replace(/\D/g, "");
  if (clean.startsWith("00966")) clean = clean.slice(2);
  else if (clean.startsWith("05")) clean = "966" + clean.slice(1);
  else if (clean.startsWith("5") && clean.length === 9) clean = "966" + clean;
  return clean;
}

function buildWhatsAppMessage(c) {
  return `⚠️ السلام عليكم ورحمة الله وبركاته،

نفيدكم بأنه لاستكمال الملفات الناقصة الخاصة بالمريض لدى مدينة الملك سلمان الطبية، نأمل التكرم بتزويدنا بالمستند التالي لإرفاقه لدى شركة التأمين:

*اسم المريض*: ${c.name || "—"}
*رقم الملف*: ${c.mrn || "—"}

*المستند المطلوب:*
${c.document || "—"}

نأمل إرسال المستند في أقرب وقت ممكن لاستكمال الإجراءات.

شاكرين لكم حسن تعاونكم وتقديركم.`;
}

window.whatsapp = function(id) {
  const c = state.cases.find(x => x.id === id);
  if (!c) return;
  const intl = formatSaudiPhone(c.phone);
  if (!intl) {
    alert("لا يوجد رقم جوال مسجل لهذه المعاملة.");
    return;
  }
  window.open(`https://wa.me/${intl}?text=${encodeURIComponent(buildWhatsAppMessage(c))}`, "_blank");
};

window.navigate = function(p) {
  page = p;
  search = "";
  typeFilter = "";
  statusFilter = "";
  render();
  window.scrollTo(0, 0);
};

function navButton(p, label, icon) {
  return `<button class="nav ${page === p ? "active" : ""}" onclick="navigate('${p}')"><span>${icon}</span><span>${label}</span></button>`;
}

function caseActions(c) {
  return `<div class="actions">
    <button class="btn small secondary" onclick="details('${c.id}')">التفاصيل</button>
    ${c.status !== "تم الإنجاز" ? `<button class="btn small" onclick="completeCase('${c.id}')">✓ إنجاز</button>` : `<button class="btn small secondary" onclick="reopenCase('${c.id}')">↺ إعادة</button>`}
    <button class="btn small gold" onclick="caseForm('${c.id}')">✎ تعديل</button>
    <button class="btn small" style="background:#1fa855" onclick="whatsapp('${c.id}')">واتساب</button>
  </div>`;
}

window.triggerSync = function() {
  fetchFromSheet().then(() => alert("تمت المزامنة مع الشيت بنجاح ✓"));
};

function render() {
  const s = stats();
  $("#root").innerHTML = `
  <div class="app">
    <aside class="sidebar">
      <div class="brand">🏥 KSAMC <small>مدينة الملك سلمان الطبية<br>تجمع المدينة المنورة الصحي</small></div>
      ${navButton("home", "الرئيسية", "⌂")}
      <button class="nav" onclick="caseForm()"><span>＋</span><span>إضافة معاملة</span></button>
      ${navButton("cases", "متابعة المعاملات", "☷")}
      ${navButton("archive", "الأرشيف (المنجزة)", "▣")}
      ${navButton("reports", "التقارير والمؤشرات", "▥")}
      ${navButton("settings", "الإعدادات والربط", "⚙")}
    </aside>

    <main class="main">
      <header class="header">
        <div>
          <h1>نظام متابعة معاملات التأمين الطبي</h1>
          <p>مدينة الملك سلمان الطبية | KSAMC — ضابط الاتصال التأميني</p>
        </div>
        <div class="header-actions">
          <button id="syncBtn" class="sync-btn" onclick="triggerSync()">🔄 مزامنة الشيت</button>
          <button class="theme-btn" onclick="toggleTheme()">
            ${isDark ? "☀️ النهاري" : "🌙 الليلي"}
          </button>
        </div>
      </header>

      <div class="content">
        ${(page === "home" || page === "cases") ? `
        <div class="stats">
          <div class="stat blue">📋 إجمالي المعاملات<strong>${s.total}</strong></div>
          <div class="stat orange">⚠️ معاملات متأخرة<strong>${s.late}</strong></div>
          <div class="stat purple">◷ تحت الإجراء<strong>${s.active}</strong></div>
          <div class="stat green">✓ تم الإنجاز<strong>${s.done}</strong></div>
        </div>` : ""}
        <div id="pageContent"></div>
      </div>
    </main>
  </div>

  <button class="btn fab" onclick="caseForm()">＋</button>
  <div class="mobilebar">
    <button class="${page === "home" ? "active" : ""}" onclick="navigate('home')"><b>⌂</b>الرئيسية</button>
    <button onclick="caseForm()"><b>＋</b>إضافة</button>
    <button class="${page === "cases" ? "active" : ""}" onclick="navigate('cases')"><b>☷</b>المعاملات</button>
    <button class="${page === "archive" ? "active" : ""}" onclick="navigate('archive')"><b>▣</b>الأرشيف</button>
    <button onclick="toggleTheme()"><b>${isDark ? "☀️" : "🌙"}</b>المظهر</button>
  </div>
  <div id="modalRoot"></div>`;

  if (page === "home" || page === "cases") renderCases(false);
  else if (page === "archive") renderCases(true);
  else if (page === "reports") renderReports();
  else if (page === "settings") renderSettings();
}

function renderCases(archive) {
  const list = filteredCases(archive);
  const title = archive ? "الأرشيف — المعاملات المنجزة" : "المعاملات النشطة (تحت الإجراء)";
  $("#pageContent").innerHTML = `
  <section class="panel">
    <h2>
      <span>${title} (${list.length})</span>
      <button class="btn small" onclick="caseForm()">＋ إضافة معاملة جديدة</button>
    </h2>
    <div class="toolbar">
      <input id="searchBox" style="flex:2;min-width:200px" placeholder="بحث باسم المريض أو رقم الملف MRN أو الهوية أو الجوال..." value="${escapeHTML(search)}">
      <select id="typeBox" style="flex:1;min-width:150px">
        <option value="">جميع أنواع الطلبات</option>
        ${["طلب مستندات", "استفسار / أمراض سابقة", "استفسار / إصابات", "حوادث وإصابات عمل"].map(t => `<option ${typeFilter === t ? "selected" : ""}>${t}</option>`).join("")}
      </select>
      ${!archive ? `
      <select id="statusBox" style="flex:1;min-width:140px">
        <option value="">جميع الحالات</option>
        ${["تحت الإجراء", "متأخرة"].map(st => `<option ${statusFilter === st ? "selected" : ""}>${st}</option>`).join("")}
      </select>` : ""}
    </div>
    <div id="caseResults"></div>
  </section>`;

  $("#searchBox").oninput = e => { search = e.target.value; drawCaseResults(archive); };
  $("#typeBox").onchange = e => { typeFilter = e.target.value; drawCaseResults(archive); };
  if ($("#statusBox")) {
    $("#statusBox").onchange = e => { statusFilter = e.target.value; drawCaseResults(archive); };
  }
  drawCaseResults(archive);
}

function drawCaseResults(archive) {
  const list = filteredCases(archive);
  const target = $("#caseResults");
  if (!list.length) {
    target.innerHTML = `<div class="empty">لا توجد معاملات مطابقة في هذا القسم ✓</div>`;
    return;
  }
  target.innerHTML = `
  <div class="tablewrap">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>تاريخ الاستلام</th>
          <th>اسم المريض</th>
          <th>MRN</th>
          <th>الجوال</th>
          <th>المستند المطلوب</th>
          <th>القسم / المستشفى</th>
          <th>الحالة</th>
          <th>الإجراءات</th>
        </tr>
      </thead>
      <tbody>
        ${list.map((c, i) => `
        <tr>
          <td>${escapeHTML(c.seq || i + 1)}</td>
          <td>${escapeHTML(c.receivedDate || "—")}</td>
          <td><strong>${escapeHTML(c.name)}</strong><div class="muted">هوية: ${escapeHTML(c.nationalId || "—")}</div></td>
          <td><strong>${escapeHTML(c.mrn)}</strong></td>
          <td dir="ltr">${escapeHTML(c.phone || "—")}</td>
          <td>${escapeHTML(c.document)}</td>
          <td>${escapeHTML(c.department || "—")}</td>
          <td>${pill(c)}</td>
          <td>${caseActions(c)}</td>
        </tr>`).join("")}
      </tbody>
    </table>
  </div>
  <div class="cards">
    ${list.map(c => `
    <div class="casecard">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
        <h3>${escapeHTML(c.name)}</h3>
        ${pill(c)}
      </div>
      <p class="muted">MRN: <strong>${escapeHTML(c.mrn)}</strong> | الهوية: ${escapeHTML(c.nationalId || "—")}</p>
      <p>📱 الجوال: <span dir="ltr">${escapeHTML(c.phone || "—")}</span></p>
      <p>📄 <strong>المطلوب:</strong> ${escapeHTML(c.document)}</p>
      <p class="muted">🏥 ${escapeHTML(c.department || "—")} | 📅 ${escapeHTML(c.receivedDate || "—")}</p>
      ${c.notes ? `<p class="muted">📝 ${escapeHTML(c.notes)}</p>` : ""}
      ${caseActions(c)}
    </div>`).join("")}
  </div>`;
}

function showModal(title, body) {
  $("#modalRoot").innerHTML = `
  <div class="modalback" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modalhead">
        <h2>${title}</h2>
        <button class="btn secondary small" onclick="closeModal()">✕ إغلاق</button>
      </div>
      ${body}
    </div>
  </div>`;
}

window.closeModal = function() {
  $("#modalRoot").innerHTML = "";
};

window.addDocChip = function(text) {
  const el = $("#f_document");
  if (!el) return;
  el.value = el.value ? el.value + " + " + text : text;
};

window.caseForm = function(id = null) {
  const c = state.cases.find(x => x.id === id);
  showModal(c ? "تعديل بيانات المعاملة" : "إضافة معاملة تأمين جديدة", `
    <form id="caseFormEl">
      <div class="formgrid">
        <div class="field">
          <label>اسم المريض (Patient Name) *</label>
          <input id="f_name" required value="${escapeHTML(c?.name || "")}">
        </div>
        <div class="field">
          <label>رقم الملف الطبي (MRN) *</label>
          <input id="f_mrn" required value="${escapeHTML(c?.mrn || "")}">
        </div>
        <div class="field">
          <label>رقم الجوال</label>
          <input id="f_phone" dir="ltr" placeholder="05xxxxxxxx" value="${escapeHTML(c?.phone || "")}">
        </div>
        <div class="field">
          <label>رقم الهوية / الإقامة / الجواز</label>
          <input id="f_nid" value="${escapeHTML(c?.nationalId || "")}">
        </div>
        <div class="field">
          <label>تاريخ الاستلام</label>
          <input id="f_date" value="${escapeHTML(c?.receivedDate || todayStr())}">
        </div>
        <div class="field">
          <label>نوع الطلب</label>
          <select id="f_type">
            ${["طلب مستندات", "استفسار / أمراض سابقة", "استفسار / إصابات", "حوادث وإصابات عمل"].map(t => `<option ${c?.type === t ? "selected" : ""}>${t}</option>`).join("")}
          </select>
        </div>
        <div class="field">
          <label>الجهة الطالبة / شركة التأمين</label>
          <input id="f_company" value="${escapeHTML(c?.company || "تجمع المدينة المنورة الصحي - إدارة تنمية الإيرادات (CBO)")}">
        </div>
        <div class="field">
          <label>المستشفى / القسم المحول</label>
          <input id="f_dept" value="${escapeHTML(c?.department || "مدينة الملك سلمان الطبية (KSAMC)")}">
        </div>
        <div class="field full">
          <label>المستندات المطلوبة *</label>
          <input id="f_document" required value="${escapeHTML(c?.document || "")}">
          <div class="chip-bar">
            ${["صورة جواز السفر", "برنت أبشر", "ختم الدخول", "تأشيرة الزيارة", "إفادة تاريخ أول تشخيص", "خطاب التحويل", "تقرير سونار الحمل والولادة"].map(ch => `<button type="button" class="chip" onclick="addDocChip('${ch}')">+ ${ch}</button>`).join("")}
          </div>
        </div>
        <div class="field">
          <label>حالة الطلب</label>
          <select id="f_status">
            ${["تحت الإجراء", "تم الإنجاز"].map(st => `<option ${c?.status === st ? "selected" : ""}>${st}</option>`).join("")}
          </select>
        </div>
        <div class="field">
          <label>تاريخ آخر متابعة</label>
          <input id="f_follow" value="${escapeHTML(c?.lastFollowUp || todayStr())}">
        </div>
        <div class="field full">
          <label>ملاحظات على الطلب</label>
          <textarea id="f_notes">${escapeHTML(c?.notes || "")}</textarea>
        </div>
      </div>
      <div style="display:flex;gap:10px;margin-top:16px;justify-content:flex-end">
        ${c ? `<button type="button" class="btn danger" onclick="deleteCase('${c.id}')">حذف</button>` : ""}
        <button type="button" class="btn secondary" onclick="closeModal()">إلغاء</button>
        <button type="submit" class="btn">💾 حفظ المعاملة</button>
      </div>
    </form>
  `);

  $("#caseFormEl").onsubmit = e => {
    e.preventDefault();
    const item = {
      id: c ? c.id : uid(),
      seq: c ? c.seq : state.cases.length + 1,
      name: $("#f_name").value.trim(),
      mrn: $("#f_mrn").value.trim(),
      phone: $("#f_phone").value.trim(),
      nationalId: $("#f_nid").value.trim(),
      receivedDate: $("#f_date").value.trim(),
      type: $("#f_type").value,
      company: $("#f_company").value.trim(),
      department: $("#f_dept").value.trim(),
      document: $("#f_document").value.trim(),
      service: $("#f_document").value.trim(),
      status: $("#f_status").value,
      lastFollowUp: $("#f_follow").value.trim(),
      notes: $("#f_notes").value.trim()
    };
    if (c) {
      const idx = state.cases.findIndex(x => x.id === c.id);
      state.cases[idx] = item;
    } else {
      state.cases.unshift(item);
    }
    saveAndSync();
    closeModal();
  };
};

window.details = function(id) {
  const c = state.cases.find(x => x.id === id);
  if (!c) return;
  showModal("تفاصيل المعاملة — " + escapeHTML(c.name), `
    <div class="formgrid">
      <div><strong>اسم المريض:</strong> ${escapeHTML(c.name)}</div>
      <div><strong>رقم الملف (MRN):</strong> ${escapeHTML(c.mrn)}</div>
      <div><strong>رقم الهوية/الجواز:</strong> ${escapeHTML(c.nationalId || "—")}</div>
      <div><strong>رقم الجوال:</strong> <span dir="ltr">${escapeHTML(c.phone || "—")}</span></div>
      <div><strong>تاريخ الاستلام:</strong> ${escapeHTML(c.receivedDate || "—")}</div>
      <div><strong>الحالة:</strong> ${pill(c)}</div>
      <div class="full"><strong>الجهة الطالبة:</strong> ${escapeHTML(c.company || "—")}</div>
      <div class="full"><strong>القسم / المستشفى:</strong> ${escapeHTML(c.department || "—")}</div>
      <div class="full"><strong>المستند المطلوب:</strong> ${escapeHTML(c.document || "—")}</div>
      <div class="full"><strong>ملاحظات:</strong> ${escapeHTML(c.notes || "لا توجد ملاحظات")}</div>
    </div>
    <hr style="border:0;border-top:1px solid var(--line);margin:16px 0">
    <div class="field">
      <label>رسالة الواتساب المعتمدة للمريض:</label>
      <textarea readonly style="min-height:160px">${escapeHTML(buildWhatsAppMessage(c))}</textarea>
    </div>
    <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
      <button class="btn" style="background:#1fa855" onclick="whatsapp('${c.id}')">إرسال واتساب مباشر</button>
      ${c.status !== "تم الإنجاز" ? `<button class="btn" onclick="completeCase('${c.id}');closeModal()">✓ اعتماد الإنجاز</button>` : ""}
      <button class="btn gold" onclick="caseForm('${c.id}')">✎ تعديل</button>
    </div>
  `);
};

window.completeCase = function(id) {
  const c = state.cases.find(x => x.id === id);
  if (!c) return;
  c.status = "تم الإنجاز";
  c.lastFollowUp = todayStr();
  saveAndSync();
};

window.reopenCase = function(id) {
  const c = state.cases.find(x => x.id === id);
  if (!c) return;
  c.status = "تحت الإجراء";
  c.lastFollowUp = todayStr();
  saveAndSync();
};

window.deleteCase = function(id) {
  if (!confirm("هل أنت متأكد من حذف هذه المعاملة؟")) return;
  state.cases = state.cases.filter(x => x.id !== id);
  saveAndSync();
  closeModal();
};

function renderReports() {
  const s = stats();
  const rate = s.total ? Math.round((s.done / s.total) * 100) : 0;
  $("#pageContent").innerHTML = `
  <section class="panel">
    <h2>التقارير ومؤشرات الإنجاز</h2>
    <p>نسبة إنجاز معاملات التأمين الطبي: <strong>${rate}%</strong> (${s.done} من أصل ${s.total})</p>
    <div class="chartbar"><span style="width:${rate}%"></span></div>
    <div class="stats">
      <div class="stat blue">إجمالي الوارد<strong>${s.total}</strong></div>
      <div class="stat green">تم الإنجاز<strong>${s.done}</strong></div>
      <div class="stat purple">تحت الإجراء<strong>${s.active}</strong></div>
      <div class="stat orange">متأخرة (+48 ساعة)<strong>${s.late}</strong></div>
    </div>
  </section>`;
}

function renderSettings() {
  $("#pageContent").innerHTML = `
  <section class="panel">
    <h2>إعدادات الربط السحابي مع Google Sheets</h2>
    <p class="muted">النظام متصل حالياً بملف Google Sheets السحابي وتتم المزامنة أوتوماتيكياً.</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px">
      <button class="btn" onclick="triggerSync()">🔄 جلب البيانات المحدثة من الشيت</button>
      <button class="btn secondary" onclick="exportJSON()">⬇ تصدير نسخة احتياطية (JSON)</button>
    </div>
  </section>`;
}

window.exportJSON = function() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "ksAMC-insurance-backup.json";
  a.click();
};

initTheme();
loadLocal();
fetchFromSheet();
</script>
</body>
</html>
