<!DOCTYPE html>
<html lang="ar" dir="rtl" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>بوابة ضابط الاتصال التأميني - KSAMC</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { tajawal: ['Tajawal', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Tajawal', sans-serif; -webkit-tap-highlight-color: transparent; }
    .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background-color: rgba(156, 163, 175, 0.4); border-radius: 9999px; }
  </style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-200 antialiased pb-20 sm:pb-8">

  <!-- Header -->
  <header class="bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 sticky top-0 z-40 transition-colors shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
      
      <div class="flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-emerald-600 to-teal-500 flex items-center justify-center text-white text-lg shadow-md shadow-emerald-600/20">
          <i class="fa-solid fa-hospital-user"></i>
        </div>
        <div>
          <div class="flex items-center gap-1.5">
            <h1 class="text-sm sm:text-base font-black text-slate-900 dark:text-white">
              متابعة طلبات التأمين
            </h1>
            <span class="text-[10px] bg-emerald-100 dark:bg-emerald-950/80 text-emerald-800 dark:text-emerald-300 border border-emerald-300/40 px-2 py-0.5 rounded-full font-bold">KSAMC</span>
          </div>
          <p class="text-[11px] text-slate-500 dark:text-slate-400">إدارة تنمية الإيرادات (CBO)</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <!-- New Request Button (Desktop/Header) -->
        <button id="btnOpenAddModal" type="button" class="hidden sm:inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold transition shadow-sm active:scale-95">
          <i class="fa-solid fa-plus"></i>
          <span>إضافة طلب جديد</span>
        </button>

        <!-- Google Sheet Link -->
        <a href="https://docs.google.com/spreadsheets/d/135L6yG_lk5HPj77mZbUqv3-oZNWWd4T5N6yR6hX3Wk0/edit" target="_blank" rel="noopener noreferrer" class="p-2 sm:px-3 sm:py-2 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-bold transition border border-slate-200 dark:border-slate-700" title="فتح قوقل شيت المباشر">
          <i class="fa-solid fa-table text-emerald-600 dark:text-emerald-400"></i>
          <span class="hidden sm:inline mr-1">الشيت السحابي</span>
        </a>

        <!-- Dark Mode Toggle -->
        <button id="themeToggleBtn" type="button" aria-label="الوضع الليلي" class="w-9 h-9 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-amber-400 border border-slate-200 dark:border-slate-700 flex items-center justify-center text-sm transition">
          <i id="themeIcon" class="fa-solid fa-moon"></i>
        </button>
      </div>

    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 max-w-6xl w-full mx-auto p-3.5 sm:p-6 space-y-4 sm:space-y-5">

    <!-- KPI Cards -->
    <section class="grid grid-cols-2 sm:grid-cols-4 gap-2.5 sm:gap-3.5">
      <div class="bg-white dark:bg-slate-900 p-3 sm:p-4 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-[11px] text-slate-500 dark:text-slate-400 font-medium">إجمالي الطلبات</p>
          <p id="kpiTotal" class="text-xl sm:text-2xl font-black text-slate-900 dark:text-white mt-0.5">10</p>
        </div>
        <div class="w-9 h-9 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 flex items-center justify-center text-sm">
          <i class="fa-solid fa-folder-open"></i>
        </div>
      </div>

      <div class="bg-white dark:bg-slate-900 p-3 sm:p-4 rounded-2xl border border-emerald-200 dark:border-emerald-900/40 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-[11px] text-emerald-700 dark:text-emerald-400 font-medium">تم الإنجاز</p>
          <p id="kpiCompleted" class="text-xl sm:text-2xl font-black text-emerald-600 dark:text-emerald-400 mt-0.5">8</p>
        </div>
        <div class="w-9 h-9 rounded-xl bg-emerald-50 dark:bg-emerald-950/60 text-emerald-600 dark:text-emerald-400 flex items-center justify-center text-sm">
          <i class="fa-solid fa-circle-check"></i>
        </div>
      </div>

      <div class="bg-white dark:bg-slate-900 p-3 sm:p-4 rounded-2xl border border-amber-200 dark:border-amber-900/40 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-[11px] text-amber-700 dark:text-amber-400 font-medium">تحت الإجراء</p>
          <p id="kpiPending" class="text-xl sm:text-2xl font-black text-amber-600 dark:text-amber-400 mt-0.5">2</p>
        </div>
        <div class="w-9 h-9 rounded-xl bg-amber-50 dark:bg-amber-950/60 text-amber-600 dark:text-amber-400 flex items-center justify-center text-sm">
          <i class="fa-solid fa-clock-rotate-left"></i>
        </div>
      </div>

      <div class="bg-white dark:bg-slate-900 p-3 sm:p-4 rounded-2xl border border-rose-200 dark:border-rose-900/40 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-[11px] text-rose-700 dark:text-rose-400 font-medium">لم يتم التنفيذ</p>
          <p id="kpiFailed" class="text-xl sm:text-2xl font-black text-rose-600 dark:text-rose-400 mt-0.5">0</p>
        </div>
        <div class="w-9 h-9 rounded-xl bg-rose-50 dark:bg-rose-950/60 text-rose-600 dark:text-rose-400 flex items-center justify-center text-sm">
          <i class="fa-solid fa-circle-xmark"></i>
        </div>
      </div>
    </section>

    <!-- Search & Filter Controls -->
    <section class="bg-white dark:bg-slate-900 p-3 sm:p-4 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-3">
      <!-- Search Input -->
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute right-3.5 top-3 text-slate-400 text-xs"></i>
        <input type="text" id="searchInput" placeholder="بحث باسم المريض، رقم الملف، الجوال، أو المستند..." class="w-full text-xs sm:text-sm pr-9 pl-4 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white focus:bg-white dark:focus:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition">
      </div>

      <!-- Filter Buttons -->
      <div class="flex items-center gap-1.5 overflow-x-auto custom-scrollbar pb-1 text-xs" id="filterTabs">
        <button type="button" data-status="all" class="filter-btn px-3 py-1.5 rounded-xl font-bold transition bg-emerald-600 text-white shadow-sm whitespace-nowrap">
          الكل (<span id="countAll">10</span>)
        </button>
        <button type="button" data-status="تحت الإجراء" class="filter-btn px-3 py-1.5 rounded-xl font-bold transition bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 whitespace-nowrap">
          تحت الإجراء (<span id="countPending">2</span>)
        </button>
        <button type="button" data-status="تم الإنجاز" class="filter-btn px-3 py-1.5 rounded-xl font-bold transition bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 whitespace-nowrap">
          تم الإنجاز (<span id="countCompleted">8</span>)
        </button>
        <button type="button" data-status="لم يتم تنفيذ المهمة" class="filter-btn px-3 py-1.5 rounded-xl font-bold transition bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 whitespace-nowrap">
          لم يتم التنفيذ (<span id="countFailed">0</span>)
        </button>
      </div>
    </section>

    <!-- Cards Container for Mobile & Mac -->
    <section class="space-y-3" id="patientCardsContainer">
      <!-- Injected by JavaScript -->
    </section>

  </main>

  <!-- Mobile Floating Action Button (FAB) -->
  <div class="sm:hidden fixed bottom-4 right-4 left-4 z-30">
    <button id="btnMobileAdd" type="button" class="w-full py-3.5 px-4 rounded-2xl bg-emerald-600 text-white font-black text-sm shadow-xl shadow-emerald-700/30 flex items-center justify-center gap-2 transition active:scale-95">
      <i class="fa-solid fa-plus text-base"></i>
      <span>إضافة طلب جديد الآن</span>
    </button>
  </div>

  <!-- Modal: Add New Request (إضافة طلب جديد) -->
  <div id="addModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4 transition-opacity">
    <div class="bg-white dark:bg-slate-900 w-full max-w-lg rounded-t-3xl sm:rounded-3xl border border-slate-200 dark:border-slate-800 shadow-2xl p-4 sm:p-6 space-y-4 max-h-[90vh] overflow-y-auto custom-scrollbar">
      
      <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 pb-3">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-xl bg-emerald-100 dark:bg-emerald-950 text-emerald-600 dark:text-emerald-400 flex items-center justify-center text-sm font-bold">
            <i class="fa-solid fa-user-plus"></i>
          </div>
          <h2 class="text-sm sm:text-base font-bold text-slate-900 dark:text-white">إضافة معاملة تأمين جديدة</h2>
        </div>
        <button id="btnCloseModal" type="button" class="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-400 hover:text-slate-700 flex items-center justify-center text-sm">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <form id="addRequestForm" class="space-y-3.5">
        <div>
          <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">اسم المريض *</label>
          <input type="text" id="modalName" required placeholder="مثال: محمد عبدالله العمري" class="w-full text-xs sm:text-sm px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>

        <div class="grid grid-cols-2 gap-2.5">
          <div>
            <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">رقم الملف (MRN) *</label>
            <input type="text" id="modalMrn" required placeholder="مثال: 1670550" class="w-full text-xs sm:text-sm px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">رقم الجوال *</label>
            <input type="tel" id="modalMobile" required placeholder="05XXXXXXXX" class="w-full text-xs sm:text-sm px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-emerald-500 text-left" dir="ltr">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">المستند المطلوب (انقر للإضافة السريعة):</label>
          <div class="flex flex-wrap gap-1 mb-1.5" id="modalTags">
            <button type="button" data-tag="صورة جواز السفر" class="quick-tag text-[11px] px-2 py-0.5 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-emerald-100 dark:hover:bg-emerald-950 transition">صورة الجواز</button>
            <button type="button" data-tag="برنت أبشر ببيانات الدخول" class="quick-tag text-[11px] px-2 py-0.5 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-emerald-100 dark:hover:bg-emerald-950 transition">برنت أبشر</button>
            <button type="button" data-tag="صورة ختم الدخول من الجواز" class="quick-tag text-[11px] px-2 py-0.5 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-emerald-100 dark:hover:bg-emerald-950 transition">ختم الدخول</button>
            <button type="button" data-tag="صورة تأشيرة الزيارة" class="quick-tag text-[11px] px-2 py-0.5 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-emerald-100 dark:hover:bg-emerald-950 transition">تأشيرة الزيارة</button>
            <button type="button" data-tag="خطاب التحويل من المستشفى الخاص" class="quick-tag text-[11px] px-2 py-0.5 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-emerald-100 dark:hover:bg-emerald-950 transition">خطاب التحويل</button>
            <button type="button" data-tag="تقرير طبي" class="quick-tag text-[11px] px-2 py-0.5 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-emerald-100 dark:hover:bg-emerald-950 transition">تقرير طبي</button>
          </div>
          <textarea id="modalReq" rows="2" required placeholder="اكتب المطلوب بدقة..." class="w-full text-xs sm:text-sm px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-emerald-500"></textarea>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">حالة الطلب الأولية</label>
          <select id="modalStatus" class="w-full text-xs sm:text-sm px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
            <option value="تحت الإجراء">تحت الإجراء (افتراضي)</option>
            <option value="تم الإنجاز">تم الإنجاز</option>
            <option value="لم يتم تنفيذ المهمة">لم يتم تنفيذ المهمة</option>
          </select>
        </div>

        <div class="pt-2 flex gap-2">
          <button type="submit" class="flex-1 py-3 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs sm:text-sm shadow-md transition active:scale-95">
            حفظ وإضافة المعاملة
          </button>
          <button type="button" id="btnCancelModal" class="py-3 px-4 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 text-xs sm:text-sm font-semibold">
            إلغاء
          </button>
        </div>
      </form>

    </div>
  </div>

  <!-- Toast -->
  <div id="toastContainer" class="fixed bottom-20 sm:bottom-5 left-4 right-4 sm:right-auto sm:left-5 z-50 flex flex-col gap-2 max-w-sm pointer-events-none"></div>

  <script>
    // Initial 10 Records from KSAMC Sheet
    const initialRecords = [
      { id: 1, name: "SAFIYA MAMA SEDEK KOF", mrn: "1666685", mobile: "0570273395", req: "صورة جواز السفر + برنت أبشر ببيانات الدخول", status: "تم الإنجاز", notes: "تم الانتهاء من الطلب وإغلاقه" },
      { id: 2, name: "ABDULLH ABDULGANI I ALSHAREF", mrn: "166508", mobile: "0566476067", req: "تقرير تفاصيل الإصابة وإفادة إصابة العمل", status: "تم الإنجاز", notes: "تم الانتهاء من الطلب وإغلاقه" },
      { id: 3, name: "JAWAHER OMER ABD ALRAHMAN Bakes", mrn: "1669942", mobile: "0576763340", req: "صورة تأشيرة الزيارة + برنت أبشر", status: "تم الإنجاز", notes: "تم استلام المستندات وإنهاء الطلب بنجاح" },
      { id: 4, name: "MURADI AHMED KUWAYBIR SALEM", mrn: "1566750", mobile: "0591033702", req: "إفادة أول تشخيص للورم الليفي بالرحم", status: "تم الإنجاز", notes: "شخصت قبل شهرين وتم إنهاء الطلب" },
      { id: 5, name: "ROANZA ASAAD SRBYNY ISMAIL", mrn: "1669684", mobile: "0543746672", req: "صورة ختم الدخول من الجواز أو برنت الدخول", status: "تم الإنجاز", notes: "تم إرفاق ختم الدخول وإنهاء الطلب بنجاح" },
      { id: 6, name: "GIRL FATEMAH FAKHAR EL DEIN KAN", mrn: "1669754", mobile: "0536682383", req: "خطاب التحويل من المستشفى الخاص", status: "تم الإنجاز", notes: "تم إرفاق خطاب التحويل وفتح الملف بنجاح" },
      { id: 7, name: "NAEMA ELTAGI AID AHMED", mrn: "1669663", mobile: "0546054339", req: "صورة التأشيرة (الفيزا) + برنت من أبشر", status: "تم الإنجاز", notes: "تم استلام التأشيرة وبرنت أبشر بنجاح" },
      { id: 8, name: "BOY SAMIA MORSHEED RAJEH", mrn: "12879270", mobile: "0561699676", req: "تقرير سونار الحمل وتاريخ الحمل وتقرير الولادة والتحويل والجواز وختم الدخول", status: "تحت الإجراء", notes: "وارد طلب استكمال نواقص مستندات المولود" },
      { id: 9, name: "Alia Khatoon Fiaz Khan", mrn: "1670143", mobile: "0559192825", req: "صورة خطاب التحويل من مستشفى المواساة", status: "تم الإنجاز", notes: "تم استلام صورة التحويل بنجاح" },
      { id: 10, name: "SULTAN GHASSAN MOHAMMED Alkotani", mrn: "1616020", mobile: "", req: "تقرير كتلة الجسم (BMI inbody report)", status: "تحت الإجراء", notes: "تحولت للإدارة الطبية لمتابعة التقرير" }
    ];

    let records = [];
    try {
      const saved = localStorage.getItem('ksamc_mobile_records');
      records = saved ? JSON.parse(saved) : initialRecords;
    } catch (e) {
      records = initialRecords;
    }

    let currentFilter = 'all';
    let searchQuery = '';

    // DOM Elements
    const patientCardsContainer = document.getElementById('patientCardsContainer');
    const searchInput = document.getElementById('searchInput');
    const filterTabs = document.getElementById('filterTabs');
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const themeIcon = document.getElementById('themeIcon');
    const addModal = document.getElementById('addModal');
    const btnOpenAddModal = document.getElementById('btnOpenAddModal');
    const btnMobileAdd = document.getElementById('btnMobileAdd');
    const btnCloseModal = document.getElementById('btnCloseModal');
    const btnCancelModal = document.getElementById('btnCancelModal');
    const addRequestForm = document.getElementById('addRequestForm');
    const modalName = document.getElementById('modalName');
    const modalMrn = document.getElementById('modalMrn');
    const modalMobile = document.getElementById('modalMobile');
    const modalReq = document.getElementById('modalReq');
    const modalStatus = document.getElementById('modalStatus');

    // Theme Management
    function initTheme() {
      try {
        const saved = localStorage.getItem('ksamc_theme');
        if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
          themeIcon.className = 'fa-solid fa-sun';
        } else {
          document.documentElement.classList.remove('dark');
          themeIcon.className = 'fa-solid fa-moon';
        }
      } catch (e) {}
    }

    themeToggleBtn.addEventListener('click', () => {
      const isDark = document.documentElement.classList.toggle('dark');
      try { localStorage.setItem('ksamc_theme', isDark ? 'dark' : 'light'); } catch (e) {}
      themeIcon.className = isDark ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
      showToast(isDark ? 'تم تفعيل الوضع الليلي 🌙' : 'تم تفعيل الوضع النهاري ☀️');
    });

    // Toast Notification
    function showToast(msg) {
      const toast = document.createElement('div');
      toast.className = 'pointer-events-auto flex items-center gap-2 px-4 py-2.5 rounded-xl shadow-lg text-xs font-bold text-white bg-slate-800 dark:bg-slate-700 transition-all transform translate-y-2 opacity-0 duration-300';
      toast.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400"></i><span>${msg}</span>`;
      document.getElementById('toastContainer').appendChild(toast);
      requestAnimationFrame(() => toast.classList.remove('translate-y-2', 'opacity-0'));
      setTimeout(() => {
        toast.classList.add('opacity-0', '-translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 2500);
    }

    function saveToStorage() {
      try {
        localStorage.setItem('ksamc_mobile_records', JSON.stringify(records));
      } catch (e) {}
    }

    // KPI Counters
    function updateKPIs() {
      const total = records.length;
      const completed = records.filter(d => d.status === 'تم الإنجاز').length;
      const pending = records.filter(d => d.status === 'تحت الإجراء').length;
      const failed = records.filter(d => d.status === 'لم يتم تنفيذ المهمة').length;

      document.getElementById('kpiTotal').textContent = total;
      document.getElementById('kpiCompleted').textContent = completed;
      document.getElementById('kpiPending').textContent = pending;
      document.getElementById('kpiFailed').textContent = failed;

      document.getElementById('countAll').textContent = total;
      document.getElementById('countCompleted').textContent = completed;
      document.getElementById('countPending').textContent = pending;
      document.getElementById('countFailed').textContent = failed;
    }

    // Render Cards (Designed specifically for Mobile & Desktop)
    function renderCards() {
      patientCardsContainer.innerHTML = '';
      const query = searchQuery.toLowerCase();

      const filtered = records.filter(item => {
        const matchesFilter = currentFilter === 'all' || item.status === currentFilter;
        const matchesSearch = !query || 
          item.name.toLowerCase().includes(query) ||
          item.mrn.includes(query) ||
          item.mobile.includes(query) ||
          item.req.includes(query);
        return matchesFilter && matchesSearch;
      });

      if (filtered.length === 0) {
        patientCardsContainer.innerHTML = `
          <div class="bg-white dark:bg-slate-900 rounded-3xl p-8 text-center border border-slate-200 dark:border-slate-800 shadow-sm">
            <i class="fa-solid fa-inbox text-3xl text-slate-300 dark:text-slate-700 mb-2 block"></i>
            <p class="text-xs sm:text-sm font-bold text-slate-500">لا توجد طلبات مطابقة للبحث أو التصفية</p>
          </div>
        `;
        return;
      }

      filtered.forEach((item) => {
        const card = document.createElement('div');
        card.className = 'bg-white dark:bg-slate-900 rounded-2xl sm:rounded-3xl p-4 sm:p-5 border border-slate-200 dark:border-slate-800 shadow-sm space-y-3 transition-colors';

        // Badges Styling
        let badgeColor = 'bg-amber-50 dark:bg-amber-950/50 text-amber-700 dark:text-amber-400 border-amber-200 dark:border-amber-800';
        let badgeIcon = 'fa-clock-rotate-left';
        if (item.status === 'تم الإنجاز') {
          badgeColor = 'bg-emerald-50 dark:bg-emerald-950/50 text-emerald-700 dark:text-emerald-400 border-emerald-200 dark:border-emerald-800';
          badgeIcon = 'fa-circle-check';
        } else if (item.status === 'لم يتم تنفيذ المهمة') {
          badgeColor = 'bg-rose-50 dark:bg-rose-950/50 text-rose-700 dark:text-rose-400 border-rose-200 dark:border-rose-800';
          badgeIcon = 'fa-circle-xmark';
        }

        // WhatsApp Link
        const cleanMobile = (item.mobile || '').replace(/^0/, '966').replace(/\D/g, '');
        const waMsg = `⚠️ السلام عليكم ورحمة الله وبركاته،\n\nنفيدكم بأنه لاستكمال الملفات الناقصة الخاصة بالمريض لدى مدينة الملك سلمان الطبية، نأمل التكرم بتزويدنا بالمستند التالي لإرفاقه لدى شركة التأمين:\n\n*اسم المريض*: ${item.name}\n*رقم الملف*: ${item.mrn}\n\n*المستند المطلوب:*\n${item.req}\n\nنأمل إرسال المستند في أقرب وقت ممكن لاستكمال الإجراءات.\n\nشاكرين لكم حسن تعاونكم وتقديركم.`;
        const waUrl = cleanMobile ? `https://wa.me/${cleanMobile}?text=${encodeURIComponent(waMsg)}` : null;

        card.innerHTML = `
          <!-- Card Header: Name + Clickable Status Pill -->
          <div class="flex items-start justify-between gap-2.5 border-b border-slate-100 dark:border-slate-800/80 pb-3">
            <div>
              <div class="flex items-center gap-1.5 flex-wrap">
                <span class="w-5 h-5 rounded-md bg-slate-100 dark:bg-slate-800 text-slate-500 font-mono text-[11px] flex items-center justify-center font-bold">${item.id}</span>
                <h3 class="text-sm sm:text-base font-black text-slate-900 dark:text-white">${item.name}</h3>
              </div>
              <div class="flex items-center gap-2 mt-1 text-xs text-slate-500 dark:text-slate-400 font-mono">
                <span><i class="fa-solid fa-id-card text-emerald-600 dark:text-emerald-400 text-[10px] ml-1"></i>ملف: <strong class="text-slate-700 dark:text-slate-200">${item.mrn}</strong></span>
                ${item.mobile ? `<span>•</span><span><i class="fa-solid fa-phone text-slate-400 text-[10px] ml-1"></i>${item.mobile}</span>` : ''}
              </div>
            </div>

            <!-- Quick Status Change Button -->
            <button type="button" data-action="toggle-status" data-id="${item.id}" class="inline-flex items-center gap-1 px-2.5 py-1 rounded-xl text-xs font-bold border ${badgeColor} transition active:scale-95 shadow-sm" title="اضغط لتغيير الحالة فوراً">
              <i class="fa-solid ${badgeIcon} text-[11px]"></i>
              <span>${item.status}</span>
              <i class="fa-solid fa-arrows-rotate text-[9px] opacity-60 mr-1"></i>
            </button>
          </div>

          <!-- Document Required Box -->
          <div class="bg-slate-50 dark:bg-slate-800/60 p-2.5 sm:p-3 rounded-xl border border-slate-200/80 dark:border-slate-800 text-xs text-slate-700 dark:text-slate-300">
            <span class="font-bold text-slate-900 dark:text-slate-100 block mb-1">المستند المطلوب:</span>
            <p class="leading-relaxed font-medium">${item.req}</p>
            ${item.notes ? `<p class="mt-1.5 text-[11px] text-slate-400 dark:text-slate-400"><i class="fa-solid fa-comment-dots text-emerald-600 ml-1"></i>${item.notes}</p>` : ''}
          </div>

          <!-- Action Buttons Bar -->
          <div class="flex items-center gap-2 pt-1">
            ${waUrl ? `
              <a href="${waUrl}" target="_blank" rel="noopener noreferrer" class="flex-1 py-2 px-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs text-center shadow-sm transition flex items-center justify-center gap-1.5 active:scale-95">
                <i class="fa-brands fa-whatsapp text-sm"></i>
                <span>مراسلة عبر واتساب</span>
              </a>
            ` : `
              <span class="flex-1 py-2 px-3 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-400 text-xs text-center font-medium">متابعة داخلية (لا يوجد جوال)</span>
            `}

            <!-- Quick Status Change Dropdown/Button -->
            <button type="button" data-action="mark-done" data-id="${item.id}" class="py-2 px-3 rounded-xl ${item.status === 'تم الإنجاز' ? 'bg-slate-100 dark:bg-slate-800 text-slate-400' : 'bg-emerald-50 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300 hover:bg-emerald-100'} font-bold text-xs transition border border-emerald-200 dark:border-emerald-800 flex items-center gap-1" title="تحديد كـ تم الإنجاز">
              <i class="fa-solid fa-check"></i>
              <span>${item.status === 'تم الإنجاز' ? 'منجز' : 'إنجاز'}</span>
            </button>

            <!-- Delete Button -->
            <button type="button" data-action="delete" data-id="${item.id}" class="w-8 h-8 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-rose-600 hover:text-white text-slate-400 flex items-center justify-center text-xs transition" title="حذف المعاملة">
              <i class="fa-solid fa-trash-can"></i>
            </button>
          </div>
        `;
        patientCardsContainer.appendChild(card);
      });
    }

    // Card Actions: Toggle Status, Mark Done, Delete
    patientCardsContainer.addEventListener('click', (e) => {
      const toggleBtn = e.target.closest('button[data-action="toggle-status"]');
      const markDoneBtn = e.target.closest('button[data-action="mark-done"]');
      const deleteBtn = e.target.closest('button[data-action="delete"]');

      if (toggleBtn) {
        const id = parseInt(toggleBtn.dataset.id, 10);
        const item = records.find(r => r.id === id);
        if (item) {
          // Cycle: تحت الإجراء -> تم الإنجاز -> لم يتم تنفيذ المهمة -> تحت الإجراء
          if (item.status === 'تحت الإجراء') item.status = 'تم الإنجاز';
          else if (item.status === 'تم الإنجاز') item.status = 'لم يتم تنفيذ المهمة';
          else item.status = 'تحت الإجراء';

          saveToStorage();
          updateKPIs();
          renderCards();
          showToast(`تم تغيير حالة (${item.name}) إلى: ${item.status}`);
        }
      }

      if (markDoneBtn) {
        const id = parseInt(markDoneBtn.dataset.id, 10);
        const item = records.find(r => r.id === id);
        if (item) {
          item.status = item.status === 'تم الإنجاز' ? 'تحت الإجراء' : 'تم الإنجاز';
          saveToStorage();
          updateKPIs();
          renderCards();
          showToast(`تم تحديث المعاملة إلى: ${item.status}`);
        }
      }

      if (deleteBtn) {
        const id = parseInt(deleteBtn.dataset.id, 10);
        const item = records.find(r => r.id === id);
        if (item) {
          records = records.filter(r => r.id !== id);
          saveToStorage();
          updateKPIs();
          renderCards();
          showToast(`تم حذف معاملة (${item.name})`);
        }
      }
    });

    // Filter Tabs
    filterTabs.addEventListener('click', (e) => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;
      document.querySelectorAll('.filter-btn').forEach(b => {
        b.className = 'filter-btn px-3 py-1.5 rounded-xl font-bold transition bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 whitespace-nowrap';
      });
      btn.className = 'filter-btn px-3 py-1.5 rounded-xl font-bold transition bg-emerald-600 text-white shadow-sm whitespace-nowrap';
      currentFilter = btn.dataset.status;
      renderCards();
    });

    // Search Listener
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderCards();
    });

    // Modal Add Handlers
    function openModal() {
      addModal.classList.remove('hidden');
      modalName.focus();
    }
    function closeModal() {
      addModal.classList.add('hidden');
      addRequestForm.reset();
    }

    btnOpenAddModal.addEventListener('click', openModal);
    btnMobileAdd.addEventListener('click', openModal);
    btnCloseModal.addEventListener('click', closeModal);
    btnCancelModal.addEventListener('click', closeModal);

    // Quick Tags in Modal
    document.querySelectorAll('.quick-tag').forEach(tagBtn => {
      tagBtn.addEventListener('click', () => {
        const tag = tagBtn.dataset.tag;
        const current = modalReq.value.trim();
        modalReq.value = current ? current + ' + ' + tag : tag;
      });
    });

    // Submit Add Form
    addRequestForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = modalName.value.trim();
      const mrn = modalMrn.value.trim();
      const mobile = modalMobile.value.trim();
      const req = modalReq.value.trim();
      const status = modalStatus.value;

      if (!name || !mrn) {
        showToast('يرجى تعبئة الحقول الأساسية المطلوبة');
        return;
      }

      const nextId = records.length > 0 ? Math.max(...records.map(r => r.id)) + 1 : 1;
      const newEntry = {
        id: nextId,
        name,
        mrn,
        mobile,
        req,
        status,
        notes: "تمت إضافتها من الجوال"
      };

      records.unshift(newEntry); // Add at the top
      saveToStorage();
      updateKPIs();
      renderCards();
      closeModal();
      showToast(`تمت إضافة طلب المريض (${name}) بنجاح`);
    });

    // Initialize
    initTheme();
    updateKPIs();
    renderCards();
  </script>
</body>
</html>
